name = "mhc-arbiter"
main = "src/worker.mjs"
compatibility_date = "2026-10-18"
workers_dev = true

[vars]
# Change cluster ID to your actual existing MHC cluster UUID.
MHC_CLUSTER_ID = "ee3ce620-43ae-43a8-907b-c69602802a1a"
# MHC_PUBLIC_HOST remains unset until BOTH dedicated origin Tunnels are ready.
# MHC_ORIGINS_JSON and credentials must be configured as Wrangler secrets.

[[durable_objects.bindings]]
name = "CLUSTER"
class_name = "ClusterState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClusterState"]
