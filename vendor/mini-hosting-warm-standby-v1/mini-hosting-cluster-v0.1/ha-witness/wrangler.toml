name = "mini-hosting-cluster-ha"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

# Must be deployed to a DIFFERENT hostname from existing monitor/telemetry services.
[[routes]]
pattern = "ha-control.thophuong.com"
custom_domain = true

[[durable_objects.bindings]]
name = "CLUSTERS"
class_name = "ClusterLease"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClusterLease"]
